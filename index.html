<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Balance & Macros</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; background: #080810; color: #eee8e0; font-family: -apple-system, system-ui, sans-serif; overflow-x: hidden; }
        input, select, textarea { background: #080810; border: 1px solid #2a2a40; border-radius: 8px; padding: 7px 10px; color: #eee8e0; font-family: inherit; fontSize: 14px; width: 100%; box-sizing: border-box; }
        .card { background: #0f0f1e; border: 1px solid #1e1e35; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- LÓGICA DE TU ARCHIVO JSX ---
        const SK = "macro_tracker_v2";
        const today = () => new Date().toISOString().split("T")[0];
        const load = () => { try { return JSON.parse(localStorage.getItem(SK)) || {}; } catch { return {}; } };
        const persist = d => localStorage.setItem(SK, JSON.stringify(d));

        const DIET_MODES = [
          { id: "deficit",       label: "Déficit",        desc: "Perder grasa",    emoji: "🔥", pct: -20 },
          { id: "mantenimiento", label: "Mantenimiento",   desc: "Peso estable",    emoji: "⚖️", pct: 0   },
          { id: "superavit",     label: "Superávit",       desc: "Ganar músculo",   emoji: "💪", pct: +15 },
        ];

        const MACRO_PRESETS = {
          deficit:       { p: 2.4, c: 2.0, f: 0.8 },
          mantenimiento: { p: 2.0, c: 3.0, f: 1.0 },
          superavit:     { p: 2.2, c: 4.5, f: 1.2 },
        };

        function calcTDEE(weight, height, age, sex, activity) {
          const bmr = sex === "m" ? 10 * weight + 6.25 * height - 5 * age + 5 : 10 * weight + 6.25 * height - 5 * age - 161;
          const f = { sedentario: 1.2, ligero: 1.375, moderado: 1.55, activo: 1.725, muyActivo: 1.9 };
          return Math.round(bmr * (f[activity] || 1.55));
        }

        const ACTIVITY_LABELS = {
          sedentario: "Sedentario (sin ejercicio)",
          ligero:     "Ligero (1-2 días/sem)",
          moderado:   "Moderado (3-4 días/sem)",
          activo:     "Activo (5+ días/sem)",
          muyActivo:  "Muy activo (2x/día)",
        };

        const FOOD_DB = [
          { name: "Huevos revueltos (2)",  p: 12, c: 2,  f: 10, cal: 180 },
          { name: "Avena con leche",       p: 8,  c: 40, f: 5,  cal: 250 },
          { name: "Pechuga de pollo 150g", p: 35, c: 0,  f: 4,  cal: 165 },
          { name: "Arroz blanco 1 taza",   p: 4,  c: 45, f: 1,  cal: 200 },
          { name: "Atún en agua 1 lata",   p: 28, c: 0,  f: 1,  cal: 120 },
        ];

        // --- COMPONENTES DE INTERFAZ ---
        function Section({ title, children }) {
          return (
            <div style={{ background: "#0f0f1e", border: "1px solid #1e1e35", borderRadius: 14, padding: 14, marginBottom: 14 }}>
              <p style={{ margin: "0 0 12px", fontSize: 12, color: "#888", textTransform: "uppercase", letterSpacing: 1 }}>{title}</p>
              {children}
            </div>
          );
        }

        function Row({ label, children }) {
          return (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 10 }}>
              <span style={{ fontSize: 13, color: "#aaa8c0", flex: 1 }}>{label}</span>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>{children}</div>
            </div>
          );
        }

        function MiniRing({ pct, color, label, value, size = 80 }) {
          const r = size / 2 - 9;
          const circ = 2 * Math.PI * r;
          const dash = circ * Math.min(1, pct / 100);
          return (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
              <svg width={size} height={size}>
                <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1e1e2e" strokeWidth={8} />
                <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={pct > 100 ? "#ef4444" : color}
                  strokeWidth={8} strokeDasharray={circ} strokeDashoffset={circ - dash}
                  strokeLinecap="round" transform={`rotate(-90 ${size/2} ${size/2})`} />
                <text x={size/2} y={size/2+4} textAnchor="middle" fill="#f0ede8" fontSize={12} fontWeight="bold">{Math.round(pct)}%</text>
              </svg>
              <span style={{ fontSize: 11, color: "#666", textTransform: "uppercase" }}>{label}</span>
              <span style={{ fontSize: 14, color, fontWeight: 700 }}>{value.toFixed(0)}g</span>
            </div>
          );
        }

        function MacroBar({ label, consumed, goal, color }) {
          const pct = goal > 0 ? Math.min(100, (consumed / goal) * 100) : 0;
          const over = consumed > goal;
          return (
            <div style={{ marginBottom: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                <span style={{ fontSize: 12, color: "#aaa", fontWeight: 600 }}>{label}</span>
                <span style={{ fontSize: 12, color: over ? "#ef4444" : color, fontWeight: 700 }}>
                  {consumed.toFixed(1)}g <span style={{ color: "#555", fontWeight: 400 }}>/ {goal}g</span>
                </span>
              </div>
              <div style={{ height: 8, background: "#1e1e2e", borderRadius: 4, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${pct}%`, background: over ? "#ef4444" : color, borderRadius: 4 }} />
              </div>
            </div>
          );
        }

        // --- APP PRINCIPAL ---
        function App() {
          const [tab, setTab] = useState("day");
          const [store, setStore] = useState(() => load());
          const [aiText, setAiText] = useState("");
          const [aiLoading, setAiLoading] = useState(false);
          const [showPicker, setShowPicker] = useState(false);
          const [custom, setCustom] = useState({ name: "", cal: "", p: "", c: "", f: "" });

          // ************************************************************
          // CONFIGURACIÓN DE TU LLAVE DE GEMINI
          // ************************************************************
          const API_KEY = ""; // <--- PEGA TU API KEY AQUÍ ENTRE LAS COMILLAS
          // ************************************************************

          const profile     = store.profile     || { weight: 81.5, height: 180, age: 41, sex: "m", activity: "moderado" };
          const diet        = store.diet        || { mode: "mantenimiento", useCustomPct: false, customPct: 0, useCustomMacros: false, customP: 2.0, customC: 3.0, customF: 1.0 };
          const meals       = store[today()]    || [];
          const ingredients = store.ingredients || "";

          const save = patch => { const next = { ...store, ...patch }; setStore(next); persist(next); };
          const addMeal = m => save({ [today()]: [...meals, { ...m, time: new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" }) }] });
          const removeMeal = i => save({ [today()]: meals.filter((_, j) => j !== i) });

          const tdee    = calcTDEE(profile.weight, profile.height, profile.age, profile.sex, profile.activity);
          const modeObj = DIET_MODES.find(d => d.id === diet.mode) || DIET_MODES[1];
          const goalCal = Math.round(tdee * (1 + (diet.useCustomPct ? Number(diet.customPct) : modeObj.pct) / 100));

          const macroBase = diet.useCustomMacros ? { p: Number(diet.customP), c: Number(diet.customC), f: Number(diet.customF) } : MACRO_PRESETS[diet.mode];
          const goalP = Math.round(macroBase.p * profile.weight);
          const goalC = Math.round(macroBase.c * profile.weight);
          const goalF = Math.round(macroBase.f * profile.weight);

          const consumed = meals.reduce((acc, m) => ({ cal: acc.cal + m.cal, p: acc.p + m.p, c: acc.c + m.c, f: acc.f + m.f }), { cal: 0, p: 0, c: 0, f: 0 });
          const rem = { cal: Math.max(0, goalCal - consumed.cal), p: Math.max(0, goalP - consumed.p), c: Math.max(0, goalC - consumed.c), f: Math.max(0, goalF - consumed.f) };
          const perKg = { p: consumed.p / profile.weight, c: consumed.c / profile.weight, f: consumed.f / profile.weight };

          async function getSuggestion() {
            setAiLoading(true); setAiText("");
            const prompt = `Eres un nutriólogo experto hablando con la esposa de un usuario. Sugiere 3 cenas para: ${rem.cal}kcal restantes (P:${rem.p}g, C:${rem.c}g, G:${rem.f}g). Ingredientes: ${ingredients || "comunes"}. Formato: NOMBRE, INGREDIENTES, MACROS, TIEMPO. Tono cariñoso.`;
            try {
              const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
              });
              const json = await res.json();
              setAiText(json.candidates[0].content.parts[0].text);
            } catch { setAiText("Error. Revisa tu API Key."); }
            setAiLoading(false);
          }

          return (
            <div style={{ maxWidth: 500, margin: "0 auto", paddingBottom: 80 }}>
              <div style={{ background: "linear-gradient(160deg,#0d0d1a,#131325)", padding: 20, borderBottom: "1px solid #1e1e30" }}>
                <h1 style={{ margin: 0, fontSize: 20 }}>🥗 Balance & Macros</h1>
              </div>

              <div style={{ display: "flex", background: "#0d0d1a", borderBottom: "1px solid #1e1e30" }}>
                {[{id:"day",e:"📊",l:"Mi día"},{id:"config",e:"⚙️",l:"Perfil"},{id:"wife",e:"💌",l:"Esposa"}].map(t => (
                  <button key={t.id} onClick={()=>setTab(t.id)} style={{ flex: 1, padding: 15, background: "none", border: "none", color: tab === t.id ? "#e8b86d" : "#557", borderBottom: tab === t.id ? "2px solid #e8b86d" : "none", fontWeight: tab === t.id ? "bold" : "normal", cursor: "pointer" }}>{t.e} {t.l}</button>
                ))}
              </div>

              <div style={{ padding: 14 }}>
                {tab === "day" && (
                  <div>
                    <div className="card">
                      <div style={{ display: "flex", justifyContent: "space-between" }}>
                        <div><p style={{ color: "#668", fontSize: 11 }}>CONSUMIDAS</p><p style={{ fontSize: 38, fontWeight: 700, color: "#e8b86d", margin: 0 }}>{consumed.cal}</p></div>
                        <div style={{ textAlign: "right" }}><p style={{ color: "#668", fontSize: 11 }}>META</p><p style={{ fontSize: 22, fontWeight: 700, color: "#7ca8f0", margin: 0 }}>{goalCal}</p></div>
                      </div>
                    </div>

                    <Section title="Macros del día">
                      <div style={{ display: "flex", justifyContent: "space-around" }}>
                        <MiniRing pct={(consumed.p/goalP)*100} color="#7ca8f0" label="Proteína" value={consumed.p} />
                        <MiniRing pct={(consumed.c/goalC)*100} color="#e8b86d" label="Carbos" value={consumed.c} />
                        <MiniRing pct={(consumed.f/goalF)*100} color="#e87d7d" label="Grasas" value={consumed.f} />
                      </div>
                      <div style={{ display: "flex", gap: 6, marginTop: 14 }}>
                        {[{l:"P g/kg",v:perKg.p,g:macroBase.p,c:"#7ca8f0"},{l:"C g/kg",v:perKg.c,g:macroBase.c,c:"#e8b86d"},{l:"G g/kg",v:perKg.f,g:macroBase.f,c:"#e87d7d"}].map(m => (
                          <div key={m.l} style={{ flex: 1, background: "#13131f", borderRadius: 8, padding: 8, textAlign: "center" }}>
                            <p style={{ margin: 0, fontSize: 10, color: "#557" }}>{m.l}</p>
                            <p style={{ margin: "2px 0 0", fontSize: 16, fontWeight: 700, color: m.c }}>{m.v.toFixed(2)}</p>
                          </div>
                        ))}
                      </div>
                    </Section>

                    <Section title="+ Agregar alimento">
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                        <input placeholder="Nombre" value={custom.name} onChange={e=>setCustom({...custom, name:e.target.value})} style={{ flex: "2 1 130px" }} />
                        <input type="number" placeholder="kcal" value={custom.cal} onChange={e=>setCustom({...custom, cal:e.target.value})} style={{ flex: "1 1 60px" }} />
                        <button onClick={()=>{ if(custom.name) addMeal({name:custom.name, cal:+custom.cal, p:0, c:0, f:0}); setCustom({name:"",cal:"",p:"",c:"",f:""}); }} style={{ background: "#e8b86d", border: "none", borderRadius: 8, padding: "8px 18px", fontWeight: "bold", cursor: "pointer" }}>+</button>
                      </div>
                    </Section>

                    <div className="card">
                      <p style={{ margin: "0 0 10px", fontSize: 12, color: "#888" }}>REGISTRO</p>
                      {meals.map((m, i) => (
                        <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: "1px solid #1a1a28" }}>
                          <div><p style={{ margin: 0, fontSize: 14 }}>{m.name}</p><p style={{ margin: 0, fontSize: 11, color: "#557" }}>{m.time}</p></div>
                          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                            <span style={{ color: "#e8b86d", fontWeight: "bold" }}>{m.cal} kcal</span>
                            <button onClick={()=>removeMeal(i)} style={{ background: "none", border: "none", color: "#433", cursor: "pointer" }}>✕</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {tab === "config" && (
                  <div>
                    <Section title="🧍 Datos personales">
                      <Row label="Peso (kg)"><input type="number" value={profile.weight} onChange={e=>save({profile:{...profile, weight:+e.target.value}})} style={{width:80}}/></Row>
                      <Row label="Altura (cm)"><input type="number" value={profile.height} onChange={e=>save({profile:{...profile, height:+e.target.value}})} style={{width:80}}/></Row>
                      <Row label="Edad"><input type="number" value={profile.age} onChange={e=>save({profile:{...profile, age:+e.target.value}})} style={{width:80}}/></Row>
                      <Row label="Actividad">
                        <select value={profile.activity} onChange={e=>save({profile:{...profile, activity:e.target.value}})} style={{maxWidth:200}}>
                          {Object.entries(ACTIVITY_LABELS).map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                        </select>
                      </Row>
                    </Section>

                    <Section title="🎯 Modo de dieta">
                      <div style={{ display: "flex", gap: 8 }}>
                        {DIET_MODES.map(m => (
                          <button key={m.id} onClick={()=>save({diet:{...diet, mode:m.id}})} style={{ flex: 1, padding: 10, background: diet.mode === m.id ? "#1e1a0e" : "#0f0f1e", border: `1px solid ${diet.mode === m.id ? "#e8b86d" : "#1e1e30"}`, borderRadius: 10, cursor: "pointer" }}>
                            <p style={{ margin: 0, fontSize: 18 }}>{m.emoji}</p>
                            <p style={{ margin: 0, fontSize: 11, color: diet.mode === m.id ? "#e8b86d" : "#888" }}>{m.label}</p>
                          </button>
                        ))}
                      </div>
                    </Section>

                    <Section title="💪 Macros (g/kg)">
                      <Row label="Personalizar">
                        <button onClick={()=>save({diet:{...diet, useCustomMacros:!diet.useCustomMacros}})} style={{ background: diet.useCustomMacros ? "#e8b86d" : "#1e1e30", border: "none", padding: "5px 10px", borderRadius: 8 }}>{diet.useCustomMacros ? "SÍ" : "NO"}</button>
                      </Row>
                      {[{k:"P",l:"Proteína",c:"#7ca8f0"},{k:"C",l:"Carbos",c:"#e8b86d"},{k:"F",l:"Grasa",c:"#e87d7d"}].map(m => (
                        <Row key={m.k} label={m.l}>
                          <input type="number" step="0.1" value={diet[`custom${m.k}`]} onChange={e=>save({diet:{...diet, [`custom${m.k}`]:e.target.value}})} style={{ width: 60, display: diet.useCustomMacros ? "block" : "none" }} />
                          <span style={{ color: m.c, fontWeight: "bold" }}>{!diet.useCustomMacros && macroBase[m.k.toLowerCase()]} g/kg</span>
                        </Row>
                      ))}
                    </Section>
                  </div>
                )}

                {tab === "wife" && (
                  <div>
                    <div className="card" style={{ background: "linear-gradient(135deg,#150d20,#0d1520)", padding: 18 }}>
                      <p style={{ color: "#97b", fontSize: 12 }}>💌 RESUMEN PARA LA CENA</p>
                      <h2 style={{ color: "#e8b86d", margin: "10px 0" }}>{rem.cal} kcal restantes</h2>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                        <div style={{ background: "rgba(0,0,0,0.3)", padding: 10, borderRadius: 8 }}>
                          <p style={{ margin: 0, fontSize: 10, color: "#668" }}>PROTEÍNA</p>
                          <p style={{ margin: 0, color: "#7ca8f0", fontWeight: "bold" }}>{rem.p}g</p>
                        </div>
                        <div style={{ background: "rgba(0,0,0,0.3)", padding: 10, borderRadius: 8 }}>
                          <p style={{ margin: 0, fontSize: 10, color: "#668" }}>CARBOS</p>
                          <p style={{ margin: 0, color: "#e8b86d", fontWeight: "bold" }}>{rem.c}g</p>
                        </div>
                      </div>
                    </div>
                    <Section title="🛒 Ingredientes disponibles">
                      <textarea value={ingredients} onChange={e=>save({ingredients:e.target.value})} placeholder="Ej: Pollo, arroz, huevos..." style={{ minHeight: 100 }} />
                    </Section>
                    <button onClick={getSuggestion} disabled={aiLoading} style={{ width: "100%", padding: 16, background: "linear-gradient(135deg,#e8b86d,#c8784a)", border: "none", borderRadius: 14, fontWeight: "bold", fontSize: 16, cursor: "pointer" }}>
                      {aiLoading ? "✨ Generando..." : "✨ Generar Cena con IA"}
                    </button>
                    {aiText && <div className="card" style={{ marginTop: 15, whiteSpace: "pre-wrap", lineHeight: 1.6 }}>{aiText}</div>}
                  </div>
                )}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
