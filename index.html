<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance & Macros</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>body { margin: 0; background: #080810; font-family: sans-serif; }</style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Configuración de almacenamiento
        const SK = "macro_tracker_v2";
        const today = () => new Date().toISOString().split("T")[0];
        const load = () => { try { return JSON.parse(localStorage.getItem(SK)) || {}; } catch { return {}; } };
        const persist = d => localStorage.setItem(SK, JSON.stringify(d));

        const DIET_MODES = [
          { id: "deficit", label: "Déficit", desc: "Perder grasa", emoji: "🔥", pct: -20 },
          { id: "mantenimiento", label: "Mantenimiento", desc: "Peso estable", emoji: "⚖️", pct: 0 },
          { id: "superavit", label: "Superávit", desc: "Ganar músculo", emoji: "💪", pct: +15 },
        ];

        const MACRO_PRESETS = {
          deficit: { p: 2.4, c: 2.0, f: 0.8 },
          mantenimiento: { p: 2.0, c: 3.0, f: 1.0 },
          superavit: { p: 2.2, c: 4.5, f: 1.2 },
        };

        function App() {
          const [tab, setTab] = useState("day");
          const [store, setStore] = useState(() => load());
          const [aiText, setAiText] = useState("");
          const [aiLoading, setAiLoading] = useState(false);

          const profile = store.profile || { weight: 75, height: 175, age: 30, sex: "m", activity: "moderado" };
          const diet = store.diet || { mode: "mantenimiento", useCustomPct: false, customPct: 0, useCustomMacros: false, customP: 2.0, customC: 3.0, customF: 1.0 };
          const meals = store[today()] || [];
          const ingredients = store.ingredients || "";

          const goalCal = 2000; // Valor simplificado para la prueba
          const consumed = meals.reduce((acc, m) => ({ cal: acc.cal + m.cal, p: acc.p + m.p, c: acc.c + m.c, f: acc.f + m.f }), { cal: 0, p: 0, c: 0, f: 0 });

          async function getSuggestion() {
            setAiLoading(true);
            try {
              const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyCdUk114BoW7aQMHzOZHGDyHflcbKZ8ir4", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: `Sugiere 3 cenas saludables con estos ingredientes: ${ingredients}. El objetivo es una dieta de ${diet.mode}.` }] }]
                }),
              });
              const json = await res.json();
              setAiText(json.candidates[0].content.parts[0].text);
            } catch (err) {
              setAiText("Error al conectar con Gemini. Revisa la consola.");
            }
            setAiLoading(false);
          }

          return (
            <div style={{ color: "#eee", padding: 20 }}>
              <nav style={{ display: "flex", gap: 10, marginBottom: 20 }}>
                <button onClick={() => setTab("day")}>📊 Mi día</button>
                <button onClick={() => setTab("wife")}>💌 Esposa</button>
              </nav>
              
              {tab === "day" && (
                <div>
                  <h2>Calorías: {consumed.cal} / {goalCal}</h2>
                  <p>Usa la pestaña "Esposa" para generar cenas.</p>
                </div>
              )}

              {tab === "wife" && (
                <div>
                  <textarea 
                    placeholder="Ingredientes en casa..." 
                    value={ingredients} 
                    onChange={(e) => {
                      const val = e.target.value;
                      const next = { ...store, ingredients: val };
                      setStore(next);
                      persist(next);
                    }}
                    style={{ width: "100%", height: 100, background: "#111", color: "#fff", padding: 10 }}
                  />
                  <button onClick={getSuggestion} disabled={aiLoading} style={{ width: "100%", padding: 15, marginTop: 10, background: "#e8b86d" }}>
                    {aiLoading ? "Cocinando ideas..." : "Generar Cena con Gemini"}
                  </button>
                  <div style={{ marginTop: 20, whiteSpace: "pre-wrap" }}>{aiText}</div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
