const JSONBIN_SECRET = "$2a$10$ppW0utPb9oiIW1mORBhvmOUl5ku2bouhhVmein6onI/EuvLqqR5jy";

async function createBin(data) {
  const res = await fetch("https://api.jsonbin.io/v3/b", {
    method:"POST",
    headers:{"Content-Type":"application/json","X-Master-Key":JSONBIN_SECRET,"X-Bin-Name":"balance-macros","X-Bin-Private":"false"},
    body:JSON.stringify(data),
  });
  const json = await res.json();
  return json.metadata?.id || null;
}
async function readBin(binId) {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${binId}/latest`,{headers:{"X-Master-Key":JSONBIN_SECRET}});
  const json = await res.json();
  return json.record || null;
}
async function writeBin(binId, data) {
  await fetch(`https://api.jsonbin.io/v3/b/${binId}`,{
    method:"PUT",
    headers:{"Content-Type":"application/json","X-Master-Key":JSONBIN_SECRET},
    body:JSON.stringify(data),
  });
}

  {emoji:"🐟",name:"Atún en agua",       pPer100g:30,note:"escurrido (lata)"},

function calcTDEE(w,h,a,s,act){
  const bmr=s==="m"?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161;
  const f={sedentario:1.2,ligero:1.375,moderado:1.55,activo:1.725,muyActivo:1.9};
  return Math.round(bmr*(f[act]||1.55));
}

const iSt={background:"#080810",border:"1px solid #2a2a40",borderRadius:8,padding:"7px 10px",color:"#eee8e0",fontSize:14,width:"100%"};
const chipSt=(active,ac="#e8b86d")=>({border:"none",borderRadius:8,padding:"6px 14px",fontSize:12,cursor:"pointer",fontWeight:600,background:active?ac:"#1e1e30",color:active?"#080810":"#aaa"});

function MacroBar({label,consumed,goal,color}){
  const pct=goal>0?Math.min(100,(consumed/goal)*100):0,over=consumed>goal;
  return(
    <div style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
        <span style={{fontSize:12,color:"#aaa",fontWeight:600,textTransform:"uppercase",letterSpacing:1}}>{label}</span>
        <span style={{fontSize:12,color:over?"#ef4444":color,fontWeight:700}}>{consumed.toFixed(1)}g <span style={{color:"#555",fontWeight:400}}>/ {goal}g</span></span>
      </div>
      <div style={{height:8,background:"#1e1e2e",borderRadius:4,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${pct}%`,background:over?"#ef4444":color,borderRadius:4,transition:"width 0.5s"}}/>
      </div>
    </div>
  );
}
function MiniRing({pct,color,label,value,size=80}){
  const r=size/2-9,circ=2*Math.PI*r,dash=circ*Math.min(1,pct/100);
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
      <svg width={size} height={size}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1e1e2e" strokeWidth={8}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={pct>100?"#ef4444":color} strokeWidth={8} strokeDasharray={circ} strokeDashoffset={circ-dash} strokeLinecap="round" transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:"stroke-dashoffset 0.6s ease"}}/>
        <text x={size/2} y={size/2+4} textAnchor="middle" fill="#f0ede8" fontSize={12} fontWeight="bold">{Math.round(pct)}%</text>
      </svg>
      <span style={{fontSize:11,color:"#666",textTransform:"uppercase",letterSpacing:0.5}}>{label}</span>
      <span style={{fontSize:14,color,fontWeight:700}}>{value.toFixed(0)}g</span>
    </div>
  );
}
function Section({title,children}){
  return(
    <div style={{background:"#0f0f1e",border:"1px solid #1e1e35",borderRadius:14,padding:14,marginBottom:14}}>

}
function Row({label,children}){

}
function SyncBadge({status}){
  const cfg={syncing:{color:"#e8b86d",text:"⟳ Sincronizando..."},synced:{color:"#22c55e",text:"☁️ Sincronizado"},error:{color:"#ef4444",text:"✕ Error de sync"},offline:{color:"#555577",text:"○ Sin conexión"}}[status]||{color:"#555577",text:""};
  return <span style={{fontSize:10,color:cfg.color,fontWeight:600,letterSpacing:0.5}}>{cfg.text}</span>;
}
function ProteinTable({targetProtein}){
  const [open,setOpen]=useState(false);
  return(
    <div style={{background:"#0f0f1e",border:"1px solid #1e1e35",borderRadius:14,padding:14,marginBottom:14}}>
      <button onClick={()=>setOpen(o=>!o)} style={{width:"100%",background:"none",border:"none",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",padding:0}}>
        <p style={{margin:0,fontSize:12,color:"#888",textTransform:"uppercase",letterSpacing:1}}>🥩 ¿Cuánta carne necesita?</p>
        <span style={{color:"#e8b86d",fontSize:13}}>{open?"▲ Cerrar":"▼ Ver tabla"}</span>
      </button>
      {open&&(
        <div style={{marginTop:12}}>
          <p style={{fontSize:12,color:"#9977bb",marginBottom:10}}>Para cubrir <strong style={{color:"#e8b86d"}}>{targetProtein.toFixed(0)}g de proteína</strong> faltantes:</p>
          {PROTEIN_SOURCES.map(src=>{
            const g=Math.round((targetProtein/src.pPer100g)*100);
            return(
              <div key={src.name} style={{display:"flex",alignItems:"center",justifyContent:"space-between",background:"#13131f",borderRadius:10,padding:"10px 12px",marginBottom:6}}>

                </div>
              </div>
            );
          })}
          <p style={{margin:"8px 0 0",fontSize:11,color:"#444466",fontStyle:"italic"}}>* Pesos en crudo. Al cocinar pierde ~25%.</p>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]               = useState("day");
  const [store,setStore]           = useState(()=>loadLocal());
  const [syncStatus,setSyncStatus] = useState("synced");
  const [lastSync,setLastSync]     = useState(null);
  const [binId,setBinId]           = useState(()=>localStorage.getItem(BIN_KEY)||null);
  const [showBinModal,setShowBinModal] = useState(false);
  const [binInput,setBinInput]     = useState("");
  const [copied,setCopied]         = useState(false);
  const syncTimer = useRef(null);

  // ── Cloud ──────────────────────────────────────────────────────────────────
  async function pushToCloud(data, currentBinId) {
    setSyncStatus("syncing");
    try {
      let id = currentBinId || binId;
      if (!id) {
        id = await createBin(data);
        if (!id) throw new Error("no id");
        localStorage.setItem(BIN_KEY, id);
        setBinId(id);
      } else {
        await writeBin(id, data);
      }
      setSyncStatus("synced");
      setLastSync(new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}));
    } catch { setSyncStatus("error"); }
  }

  async function pullFromCloud(id) {
    const useId = id || binId;
    if (!useId) return;
    setSyncStatus("syncing");
    try {
      const remote = await readBin(useId);
      if (remote) {
        setStore(remote);
        saveLocal(remote);
        setSyncStatus("synced");
        setLastSync(new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}));
      }
    } catch { setSyncStatus("error"); }
  }

  // auto-pull on wife tab
  useEffect(()=>{
    if(tab==="wife"){ pullFromCloud(); const iv=setInterval(pullFromCloud,30000); return()=>clearInterval(iv); }
  },[tab,binId]);

  function save(patch){
    const next={...store,...patch};
    setStore(next); saveLocal(next);
    clearTimeout(syncTimer.current);
    syncTimer.current=setTimeout(()=>pushToCloud(next),1200);
  }

  // connect wife's phone to same bin
  async function connectToBin(){
    const id = binInput.trim();
    if(!id) return;
    localStorage.setItem(BIN_KEY, id);
    setBinId(id);
    await pullFromCloud(id);
    setShowBinModal(false);
    setBinInput("");
  }

  function copyBinId(){
    if(!binId) return;
    navigator.clipboard?.writeText(binId).catch(()=>{});
    setCopied(true);
    setTimeout(()=>setCopied(false),2000);
  }

  const profile     = store.profile     || {weight:75,height:175,age:30,sex:"m",activity:"moderado"};
  const diet        = store.diet        || {mode:"mantenimiento",useCustomPct:false,customPct:0,useCustomMacros:false,customP:2.0,customC:3.0,customF:1.0};
  const meals       = store[today()]    || [];
  const ingredients = store.ingredients || "";

  const upProfile=p=>save({profile:{...profile,...p}});
  const upDiet   =p=>save({diet:{...diet,...p}});
  const setIng   =v=>save({ingredients:v});
  const addMeal  =m=>save({[today()]:[...meals,m]});
  const delMeal  =i=>save({[today()]:meals.filter((_,j)=>j!==i)});

  const tdee   =calcTDEE(profile.weight,profile.height,profile.age,profile.sex,profile.activity);
  const modeObj=DIET_MODES.find(d=>d.id===diet.mode)||DIET_MODES[1];
  const pctAdj =diet.useCustomPct?Number(diet.customPct):modeObj.pct;
  const goalCal=Math.round(tdee*(1+pctAdj/100));
  const mb     =diet.useCustomMacros?{p:Number(diet.customP),c:Number(diet.customC),f:Number(diet.customF)}:MACRO_PRESETS[diet.mode];
  const goalP=Math.round(mb.p*profile.weight),goalC=Math.round(mb.c*profile.weight),goalF=Math.round(mb.f*profile.weight);
  const cons=meals.reduce((a,m)=>({cal:a.cal+m.cal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{cal:0,p:0,c:0,f:0});
  const rem={cal:Math.max(0,goalCal-cons.cal),p:Math.max(0,goalP-cons.p),c:Math.max(0,goalC-cons.c),f:Math.max(0,goalF-cons.f)};
  const pkg={p:cons.p/profile.weight,c:cons.c/profile.weight,f:cons.f/profile.weight};

  const [aiText,setAiText]        =useState("");
  const [aiLoading,setAiLoading]  =useState(false);
  const [showPicker,setShowPicker]=useState(false);
  const [custom,setCustom]        =useState({name:"",cal:"",p:"",c:"",f:""});

  async function getSuggestion(){
    setAiLoading(true);setAiText("");
    const ms=meals.length?meals.map(m=>`${m.name}(${m.cal}kcal P${m.p}g C${m.c}g G${m.f}g)`).join("; "):"ninguna";
    const prompt=`Eres nutriólogo experto. Le hablas a la esposa de alguien con registro nutricional.
DIETA: ${modeObj.label} (${pctAdj>=0?"+":""}${pctAdj}%) · Meta: ${goalCal}kcal · Consumidas: ${cons.cal}kcal
MACROS PARA CENAR: Proteína ${rem.p.toFixed(0)}g (lleva ${pkg.p.toFixed(2)}g/kg, meta ${mb.p}g/kg) · Carbos ${rem.c.toFixed(0)}g · Grasas ${rem.f.toFixed(0)}g
COMIÓ HOY: ${ms}
INGREDIENTES EN CASA: ${ingredients||"no especificados, sugiere algo sencillo"}
Da exactamente 3 opciones de cena usando preferentemente los ingredientes disponibles. Para cada una:
🍽️ NOMBRE
📋 Ingredientes con porciones exactas (indica peso en crudo de las carnes)
📊 P Xg | C Xg | G Xg | Total Xkcal
⏱️ Tiempo de preparación
💡 Tip corto
Al final indica cuál es la mejor opción para dieta ${modeObj.label} y por qué. Tono amigable hacia la esposa.`;
    try{
      const res=await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
      const json=await res.json();
      setAiText(json.candidates?.[0]?.content?.parts?.[0]?.text||"Sin respuesta de Gemini.");
    }catch{setAiText("Error de conexión. Verifica tu API key.");}
    setAiLoading(false);
  }

  const TABS=[{id:"day",e:"📊",l:"Mi día"},{id:"config",e:"⚙️",l:"Perfil"},{id:"wife",e:"💌",l:"Mi esposa"}];

  return(
    <div style={{minHeight:"100vh",background:"#080810",color:"#eee8e0",maxWidth:500,margin:"0 auto",paddingBottom:72}}>

      {/* Header */}
      <div style={{background:"linear-gradient(160deg,#0d0d1a,#131325)",padding:"18px 18px 12px",borderBottom:"1px solid #1e1e30"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <h1 style={{margin:0,fontSize:20,fontWeight:700,letterSpacing:0.5}}>🥗 Balance & Macros</h1>
          <div style={{textAlign:"right"}}>
            <SyncBadge status={syncStatus}/>
            {lastSync&&<p style={{margin:"2px 0 0",fontSize:9,color:"#444466"}}>sync {lastSync}</p>}
          </div>
        </div>
        <p style={{margin:"3px 0 0",fontSize:11,color:"#555577"}}>
          {new Date().toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
        </p>
      </div>

      {/* Top nav */}
      <div style={{display:"flex",background:"#0d0d1a",borderBottom:"1px solid #1e1e30"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"11px 4px",border:"none",background:"transparent",color:tab===t.id?"#e8b86d":"#555577",fontSize:12,fontWeight:tab===t.id?700:400,borderBottom:tab===t.id?"2px solid #e8b86d":"2px solid transparent",cursor:"pointer"}}>{t.e} {t.l}</button>
        ))}
      </div>

      {/* ═══ MI DÍA ═══ */}
      {tab==="day"&&(
        <div style={{padding:"16px 14px"}}>
          <div style={{background:"#0f0f1e",border:"1px solid #1e1e35",borderRadius:16,padding:"18px 18px 14px",marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
              <div>
                <p style={{margin:0,fontSize:11,color:"#666688",textTransform:"uppercase",letterSpacing:1}}>Consumidas</p>
                <p style={{margin:0,fontSize:38,fontWeight:700,lineHeight:1,color:cons.cal>goalCal?"#ef4444":"#e8b86d"}}>{cons.cal}<span style={{fontSize:14,color:"#555577",fontWeight:400}}> kcal</span></p>
              </div>
              <div style={{textAlign:"right"}}>
                <p style={{margin:0,fontSize:11,color:"#666688",textTransform:"uppercase",letterSpacing:1}}>Meta {modeObj.emoji}</p>
                <p style={{margin:0,fontSize:22,fontWeight:700,color:"#7ca8f0"}}>{goalCal}</p>
                <p style={{margin:0,fontSize:10,color:"#555577"}}>TDEE {tdee} · {pctAdj>=0?"+":""}{pctAdj}%</p>
              </div>
            </div>
            <div style={{height:6,background:"#1e1e30",borderRadius:3,overflow:"hidden",marginBottom:6}}>
              <div style={{height:"100%",width:`${Math.min(100,(cons.cal/goalCal)*100)}%`,background:cons.cal>goalCal?"#ef4444":"#e8b86d",borderRadius:3,transition:"width 0.5s"}}/>
            </div>
            <p style={{margin:0,fontSize:12,color:"#7ca8f0",textAlign:"right"}}>{rem.cal>0?`Faltan ${rem.cal} kcal`:"✓ Meta alcanzada"}</p>
          </div>

          <div style={{background:"#0f0f1e",border:"1px solid #1e1e35",borderRadius:14,padding:"14px 10px",marginBottom:14}}>
            <p style={{margin:"0 0 12px 4px",fontSize:11,color:"#666688",textTransform:"uppercase",letterSpacing:1}}>Macros del día</p>
            <div style={{display:"flex",justifyContent:"space-around"}}>
              <MiniRing pct={(cons.p/goalP)*100} color="#7ca8f0" label="Proteína" value={cons.p}/>
              <MiniRing pct={(cons.c/goalC)*100} color="#e8b86d" label="Carbos"   value={cons.c}/>
              <MiniRing pct={(cons.f/goalF)*100} color="#e87d7d" label="Grasas"   value={cons.f}/>
            </div>
            <div style={{display:"flex",gap:6,marginTop:14}}>
              {[{l:"P g/kg",v:pkg.p,g:mb.p,c:"#7ca8f0"},{l:"C g/kg",v:pkg.c,g:mb.c,c:"#e8b86d"},{l:"G g/kg",v:pkg.f,g:mb.f,c:"#e87d7d"}].map(m=>(
                <div key={m.l} style={{flex:1,background:"#13131f",borderRadius:8,padding:"8px 6px",textAlign:"center"}}>
                  <p style={{margin:0,fontSize:10,color:"#555577",textTransform:"uppercase"}}>{m.l}</p>
                  <p style={{margin:"2px 0 0",fontSize:16,fontWeight:700,color:m.v>m.g?"#ef4444":m.c}}>{m.v.toFixed(2)}</p>
                  <p style={{margin:0,fontSize:10,color:"#444466"}}>/ {m.g}</p>
                </div>
              ))}
            </div>
          </div>

          <div style={{background:"#0f0f1e",border:"1px solid #1e1e35",borderRadius:14,padding:14,marginBottom:14}}>
            <MacroBar label="Proteína"      consumed={cons.p} goal={goalP} color="#7ca8f0"/>
            <MacroBar label="Carbohidratos" consumed={cons.c} goal={goalC} color="#e8b86d"/>
            <MacroBar label="Grasas"        consumed={cons.f} goal={goalF} color="#e87d7d"/>
          </div>

          <div style={{background:"#0f0f1e",border:"1px solid #1e1e35",borderRadius:14,padding:14,marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <p style={{margin:0,fontSize:12,color:"#888",textTransform:"uppercase",letterSpacing:1}}>+ Agregar alimento</p>
              <button onClick={()=>setShowPicker(p=>!p)} style={{background:"#1e1e30",border:"none",color:"#e8b86d",borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer"}}>{showPicker?"▲ Cerrar":"▼ Lista rápida"}</button>
            </div>
            {showPicker&&(
              <div style={{maxHeight:190,overflowY:"auto",borderRadius:8,border:"1px solid #1e1e30",marginBottom:10}}>
                {FOOD_DB.map((f,i)=>(
                  <button key={i} onClick={()=>{addMeal({...f,time:new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})});setShowPicker(false);}}
                    style={{display:"flex",justifyContent:"space-between",width:"100%",padding:"9px 12px",background:i%2===0?"#0d0d1a":"#0f0f1e",border:"none",borderBottom:"1px solid #1a1a28",color:"#eee8e0",cursor:"pointer",textAlign:"left"}}>
                    <span style={{fontSize:13}}>{f.name}</span>
                    <span style={{fontSize:11,color:"#666",whiteSpace:"nowrap"}}>P{f.p}·C{f.c}·G{f.f} | <span style={{color:"#e8b86d"}}>{f.cal}kcal</span></span>
                  </button>
                ))}
              </div>
            )}
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              <input placeholder="Nombre del alimento" value={custom.name} onChange={e=>setCustom(p=>({...p,name:e.target.value}))} style={{...iSt,flex:"2 1 130px",width:"auto"}}/>
              <input type="number" placeholder="kcal" value={custom.cal} onChange={e=>setCustom(p=>({...p,cal:e.target.value}))} style={{...iSt,flex:"1 1 60px",width:"auto"}}/>
              <input type="number" placeholder="P(g)" value={custom.p}   onChange={e=>setCustom(p=>({...p,p:e.target.value}))}   style={{...iSt,flex:"1 1 50px",width:"auto"}}/>
              <input type="number" placeholder="C(g)" value={custom.c}   onChange={e=>setCustom(p=>({...p,c:e.target.value}))}   style={{...iSt,flex:"1 1 50px",width:"auto"}}/>
              <input type="number" placeholder="G(g)" value={custom.f}   onChange={e=>setCustom(p=>({...p,f:e.target.value}))}   style={{...iSt,flex:"1 1 50px",width:"auto"}}/>
              <button onClick={()=>{
                if(!custom.name||!custom.cal)return;
                addMeal({name:custom.name,cal:+custom.cal,p:+(custom.p||0),c:+(custom.c||0),f:+(custom.f||0),time:new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"})});
                setCustom({name:"",cal:"",p:"",c:"",f:""});
              }} style={{background:"#e8b86d",border:"none",borderRadius:8,padding:"8px 18px",color:"#080810",fontWeight:700,fontSize:16,cursor:"pointer"}}>+</button>
            </div>
          </div>

          <div style={{background:"#0f0f1e",border:"1px solid #1e1e35",borderRadius:14,padding:14}}>
            <p style={{margin:"0 0 10px",fontSize:12,color:"#888",textTransform:"uppercase",letterSpacing:1}}>Registro del día</p>
            {meals.length===0
              ?<p style={{color:"#333355",fontSize:13,fontStyle:"italic",textAlign:"center",padding:"16px 0"}}>Aún no hay comidas registradas hoy.</p>
              :meals.map((m,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",padding:"9px 0",borderBottom:i<meals.length-1?"1px solid #1a1a28":"none"}}>
                  <div style={{flex:1}}>
                    <p style={{margin:0,fontSize:14}}>{m.name}</p>
                    <p style={{margin:"2px 0 0",fontSize:11,color:"#555577"}}>P{m.p}g · C{m.c}g · G{m.f}g · {m.time}</p>
                  </div>
                  <span style={{color:"#e8b86d",fontWeight:700,fontSize:14,marginRight:10}}>{m.cal} kcal</span>
                  <button onClick={()=>delMeal(i)} style={{background:"none",border:"none",color:"#443333",fontSize:16,cursor:"pointer"}}>✕</button>
                </div>
              ))
            }
          </div>
        </div>
      )}

      {/* ═══ PERFIL ═══ */}
      {tab==="config"&&(
        <div style={{padding:"16px 14px"}}>
          <Section title="🧍 Datos personales">
            <Row label="Peso (kg)"><input type="number" value={profile.weight} onChange={e=>upProfile({weight:+e.target.value})} style={{...iSt,width:80,textAlign:"center"}}/></Row>
            <Row label="Altura (cm)"><input type="number" value={profile.height} onChange={e=>upProfile({height:+e.target.value})} style={{...iSt,width:80,textAlign:"center"}}/></Row>
            <Row label="Edad"><input type="number" value={profile.age} onChange={e=>upProfile({age:+e.target.value})} style={{...iSt,width:80,textAlign:"center"}}/></Row>
            <Row label="Sexo">
              <button onClick={()=>upProfile({sex:"m"})} style={chipSt(profile.sex==="m")}>Hombre</button>
              <button onClick={()=>upProfile({sex:"f"})} style={chipSt(profile.sex==="f")}>Mujer</button>
            </Row>
            <Row label="Actividad">
              <select value={profile.activity} onChange={e=>upProfile({activity:e.target.value})} style={{...iSt,padding:"6px 8px",maxWidth:240}}>
                {Object.entries(ACT).map(([v,l])=><option key={v} value={v}>{l}</option>)}
              </select>
            </Row>
            <div style={{marginTop:8,background:"#13131f",borderRadius:8,padding:"10px 12px",display:"flex",justifyContent:"space-between"}}>
              <span style={{fontSize:12,color:"#666688"}}>TDEE calculado</span>
              <span style={{fontWeight:700,color:"#7ca8f0"}}>{tdee} kcal/día</span>
            </div>
          </Section>

          <Section title="🎯 Modo de dieta">
            <div style={{display:"flex",gap:8,marginBottom:12}}>
              {DIET_MODES.map(d=>(
                <button key={d.id} onClick={()=>upDiet({mode:d.id})} style={{flex:1,padding:"10px 4px",borderRadius:10,border:`1px solid ${diet.mode===d.id?"#e8b86d":"#1e1e30"}`,background:diet.mode===d.id?"#1e1a0e":"#0f0f1e",cursor:"pointer"}}>
                  <p style={{margin:0,fontSize:18}}>{d.emoji}</p>
                  <p style={{margin:"2px 0 0",fontSize:11,color:diet.mode===d.id?"#e8b86d":"#888",fontWeight:600}}>{d.label}</p>
                  <p style={{margin:0,fontSize:10,color:"#555577"}}>{d.pct>0?"+":""}{d.pct}%</p>
                </button>
              ))}
            </div>
            <Row label="% personalizado">
              <button onClick={()=>upDiet({useCustomPct:!diet.useCustomPct})} style={chipSt(diet.useCustomPct)}>{diet.useCustomPct?"Activo ✓":"Activar"}</button>
            </Row>
            {diet.useCustomPct&&(
              <Row label={`Ajuste: ${diet.customPct>=0?"+":""}${diet.customPct}%`}>
                <input type="range" min={-40} max={40} step={5} value={diet.customPct} onChange={e=>upDiet({customPct:+e.target.value})} style={{flex:1,accentColor:"#e8b86d"}}/>
              </Row>
            )}
            <div style={{background:"#13131f",borderRadius:8,padding:"10px 12px",marginTop:8,display:"flex",justifyContent:"space-between"}}>
              <span style={{fontSize:12,color:"#666688"}}>Meta calórica</span>
              <span style={{fontWeight:700,color:"#e8b86d"}}>{goalCal} kcal/día</span>
            </div>
          </Section>

          <Section title="💪 Metas de macros (g/kg peso)">
            <Row label="Macros personalizados">
              <button onClick={()=>upDiet({useCustomMacros:!diet.useCustomMacros})} style={chipSt(diet.useCustomMacros,"#7ca8f0")}>{diet.useCustomMacros?"Personalizado ✓":"Usar preset"}</button>
            </Row>
            {[{k:"P",l:"Proteína",c:"#7ca8f0",mk:"p"},{k:"C",l:"Carbohidratos",c:"#e8b86d",mk:"c"},{k:"F",l:"Grasa",c:"#e87d7d",mk:"f"}].map(({k,l,c,mk})=>{
              const val=diet.useCustomMacros?diet[`custom${k}`]:mb[mk];
              return(
                <Row key={k} label={`${l} g/kg`}>
                  {diet.useCustomMacros?<input type="number" step="0.1" value={diet[`custom${k}`]} onChange={e=>upDiet({[`custom${k}`]:e.target.value})} style={{...iSt,width:70,textAlign:"center"}}/>:<span style={{color:c,fontWeight:700}}>{val} g/kg</span>}
                  <span style={{fontSize:11,color:"#555577"}}>→ {Math.round(val*profile.weight)}g</span>
                </Row>
              );
            })}
          </Section>

          {/* ── SINCRONIZACIÓN ── */}
          <Section title="☁️ Sincronización con mi esposa">
            {binId ? (
              <>
                <p style={{fontSize:12,color:"#666688",marginBottom:10}}>Tu ID de nube (compártelo con tu esposa):</p>
                <div style={{background:"#13131f",borderRadius:10,padding:"10px 12px",marginBottom:10,wordBreak:"break-all",fontSize:13,color:"#7ca8f0",letterSpacing:0.5}}>
                  {binId}
                </div>
                <button onClick={copyBinId} style={{width:"100%",padding:"10px",background:copied?"#22c55e":"#1e1e30",border:"none",borderRadius:10,color:copied?"#080810":"#e8b86d",fontSize:13,fontWeight:700,cursor:"pointer",marginBottom:8}}>
                  {copied?"✓ ¡Copiado!":"📋 Copiar ID"}
                </button>
                <p style={{fontSize:11,color:"#444466",textAlign:"center"}}>Tu esposa debe pegar este ID en su app (pestaña Perfil → Sincronización)</p>
              </>
            ) : (
              <>
                <p style={{fontSize:12,color:"#666688",marginBottom:10}}>Aún no tienes datos en la nube. Agrega una comida para crear tu nube automáticamente.</p>
                <button onClick={()=>setShowBinModal(true)} style={{width:"100%",padding:"10px",background:"#1e1e30",border:"none",borderRadius:10,color:"#e8b86d",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                  🔗 Conectar a nube existente
                </button>
              </>
            )}
            {!binId&&<div style={{height:8}}/>}
            <button onClick={()=>setShowBinModal(true)} style={{width:"100%",padding:"10px",background:"#1e1e30",border:"1px dashed #2a2a40",borderRadius:10,color:"#888",fontSize:12,cursor:"pointer",marginTop:6}}>
              🔗 Soy la esposa — conectar con el ID de mi esposo
            </button>
          </Section>
        </div>
      )}

      {/* ═══ MI ESPOSA ═══ */}
      {tab==="wife"&&(
        <div style={{padding:"16px 14px"}}>
          <div style={{background:"#0f0f1e",border:"1px solid #1e1e35",borderRadius:12,padding:"10px 14px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:12,color:"#666688"}}>Datos en tiempo real</span>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <SyncBadge status={syncStatus}/>
              <button onClick={()=>pullFromCloud()} style={{background:"#1e1e30",border:"none",color:"#e8b86d",borderRadius:6,padding:"4px 10px",fontSize:11,cursor:"pointer"}}>↻ Actualizar</button>
            </div>
          </div>

          <div style={{background:"linear-gradient(135deg,#150d20,#0d1520)",border:"1px solid #2a1a3a",borderRadius:16,padding:18,marginBottom:14}}>
            <p style={{margin:"0 0 12px",fontSize:12,color:"#9977bb",textTransform:"uppercase",letterSpacing:1}}>💌 Resumen para la cena de hoy</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
              {[
                {l:"Calorías para cenar",v:`${rem.cal} kcal`,c:"#e8b86d"},
                {l:"Modo de dieta",v:`${modeObj.emoji} ${modeObj.label}`,c:"#c8a8f8"},
                {l:"Proteína faltante",v:`${rem.p.toFixed(0)}g`,c:"#7ca8f0"},
                {l:"Carbos faltantes",v:`${rem.c.toFixed(0)}g`,c:"#e8b86d"},
              ].map(({l,v,c})=>(
                <div key={l} style={{background:"rgba(0,0,0,0.3)",borderRadius:10,padding:"10px 12px"}}>
                  <p style={{margin:0,fontSize:10,color:"#666688",textTransform:"uppercase",letterSpacing:0.5}}>{l}</p>
                  <p style={{margin:"3px 0 0",fontSize:17,fontWeight:700,color:c}}>{v}</p>
                </div>
              ))}
            </div>
            <div style={{background:"rgba(0,0,0,0.3)",borderRadius:10,padding:"10px 12px"}}>
              <p style={{margin:"0 0 6px",fontSize:10,color:"#666688",textTransform:"uppercase",letterSpacing:0.5}}>Proteína acumulada g/kg</p>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{flex:1,height:8,background:"#1e1e30",borderRadius:4,overflow:"hidden"}}>
                  <div style={{height:"100%",width:`${Math.min(100,(pkg.p/mb.p)*100)}%`,background:"#7ca8f0",borderRadius:4,transition:"width 0.5s"}}/>
                </div>
                <span style={{fontSize:13,color:"#7ca8f0",fontWeight:700,whiteSpace:"nowrap"}}>{pkg.p.toFixed(2)} / {mb.p} g/kg</span>
              </div>
            </div>
          </div>

          <ProteinTable targetProtein={rem.p}/>

          <div style={{background:"#0f0f1e",border:"1px solid #1e1e35",borderRadius:14,padding:14,marginBottom:14}}>
            <p style={{margin:"0 0 8px",fontSize:12,color:"#888",textTransform:"uppercase",letterSpacing:1}}>🛒 Ingredientes disponibles en casa</p>
            <textarea value={ingredients} onChange={e=>setIng(e.target.value)} placeholder="Ej: pollo, arroz, brócoli, huevos, tortillas, queso, frijoles, aguacate..." style={{...iSt,minHeight:80,resize:"vertical",padding:"10px 12px"}}/>
            <p style={{margin:"6px 0 0",fontSize:11,color:"#444466"}}>Gemini usará estos ingredientes para las opciones de cena.</p>
          </div>

          <button onClick={getSuggestion} disabled={aiLoading} style={{width:"100%",padding:16,border:"none",borderRadius:14,background:aiLoading?"#1e1e30":"linear-gradient(135deg,#e8b86d,#c8784a)",color:aiLoading?"#666":"#080810",fontSize:15,fontWeight:700,cursor:aiLoading?"not-allowed":"pointer",marginBottom:14}}>
            {aiLoading?"✨ Generando sugerencias...":"✨ Generar opciones de cena con Gemini"}
          </button>

          {aiText&&<div style={{background:"#0f0f1e",border:"1px solid #2a2a40",borderRadius:14,padding:16,fontSize:14,lineHeight:1.75,color:"#ddd8d0",whiteSpace:"pre-wrap"}}>{aiText}</div>}
          {!aiText&&!aiLoading&&(
            <div style={{textAlign:"center",padding:"28px 0",color:"#333355"}}>
              <p style={{fontSize:36,marginBottom:8}}>👨‍🍳</p>
              <p style={{fontSize:13,fontStyle:"italic"}}>Escribe los ingredientes y presiona el botón para recibir 3 opciones de cena.</p>
            </div>
          )}
        </div>
      )}

      {/* ── Modal conectar bin ── */}
      {showBinModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:20}}>
          <div style={{background:"#13131f",borderRadius:16,padding:24,width:"100%",maxWidth:420,border:"1px solid #2a2a40"}}>
            <p style={{margin:"0 0 6px",fontSize:16,fontWeight:700,color:"#eee8e0"}}>🔗 Conectar a la nube</p>
            <p style={{margin:"0 0 16px",fontSize:13,color:"#666688"}}>Pega el ID que te compartió tu esposo:</p>
            <input value={binInput} onChange={e=>setBinInput(e.target.value)} placeholder="Ej: 64f3a1b2e3..." style={{...iSt,marginBottom:14,fontSize:14}}/>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>{setShowBinModal(false);setBinInput("");}} style={{flex:1,padding:"11px",background:"#1e1e30",border:"none",borderRadius:10,color:"#888",fontSize:14,cursor:"pointer"}}>Cancelar</button>
              <button onClick={connectToBin} style={{flex:2,padding:"11px",background:"linear-gradient(135deg,#e8b86d,#c8784a)",border:"none",borderRadius:10,color:"#080810",fontSize:14,fontWeight:700,cursor:"pointer"}}>✓ Conectar</button>
            </div>
          </div>
        </div>
      )}

      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:500,background:"#0d0d1a",borderTop:"1px solid #1e1e30",display:"flex"}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:"12px 4px 10px",border:"none",background:"transparent",color:tab===t.id?"#e8b86d":"#444466",fontSize:11,cursor:"pointer"}}>{t.e}<br/>{t.l}</button>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
